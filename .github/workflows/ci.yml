name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
    - name: Test relay
      run: |
        cd relay
        go vet ./...
        go test ./... -count=1
        go test -race ./...

  nexus:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
    - name: Test nexus
      run: |
        cd nexus
        go vet ./...
        go test ./... -count=1
        go test -race ./...

  sibyl:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
    - name: Test sibyl
      run: |
        cd sibyl
        python -m unittest discover -s tests
        cd gateway
        go vet ./...
        go test ./... -count=1
